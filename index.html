<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Quiz</title>
    
    <!-- Link Preview Settings (Forces apps to show a clean neutral card) -->
    <meta property="og:title" content="Quick Personality Quiz">
    <meta property="og:description" content="Answer this quick question to see your score!">
    <meta property="og:image" content="https://dummyimage.com/1200x630/1a1a1a/ffffff.png&text=Quick+Quiz">
    <meta name="twitter:card" content="summary_large_image">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Question Box -->
    <div class="card" id="mainCard">
        <h1>ARE YOU GAY?</h1>
        <div class="buttons">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>
    </div>

    <!-- Fullscreen Meme Overlay -->
    <div id="jumpscare" class="hidden">
        <h1 class="meme-text">NAH LUMBAO AURA FARM</h1>
    </div>

    <!-- Looping Audio -->
    <audio id="bgMusic" src="assets/music.mp3" loop preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
