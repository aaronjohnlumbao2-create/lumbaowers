<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fun Quiz</title>
    
    <!-- Link preview card customization -->
    <meta property="og:title" content="Personality Quiz">
    <meta property="og:description" content="Take this quick 2-question test!">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Question Box -->
    <div class="card" id="mainCard">
        <h1>ARE YOU GAY?</h1>
        <div class="buttons">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>
    </div>

    <!-- Fullscreen Meme Overlay (Image tag removed, injected via JS instead) -->
    <div id="jumpscare" class="hidden">
        <h1 class="meme-text">NAH LUMBAO AURA FARM</h1>
    </div>

    <!-- Looping Audio -->
    <audio id="bgMusic" src="assets/music.mp3" loop preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
